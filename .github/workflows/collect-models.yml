name: Collect model source data

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/integrity_policy.json'
      - '.github/workflows/collect-models.yml'
  schedule:
    - cron: '35 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Reduced lead set and no medium-range extension'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-model-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
    steps:
      - uses: actions/checkout@v4
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests ecmwf-opendata
      - name: Fetch ICON-D2 and GFS
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.test_mode }}" = "true" ]; then
            python src/fetch_model_data.py --test
          else
            python src/fetch_model_data.py
          fi
      - name: Fetch ECMWF-IFS and GEFS-control
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.test_mode }}" = "true" ]; then
            python src/fetch_extra_models.py --test
          else
            python src/fetch_extra_models.py
          fi
      - name: Fetch ICON-EU and ICON-D2-EPS
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.test_mode }}" = "true" ]; then
            python src/fetch_dwd_additional_models.py --test
          else
            python src/fetch_dwd_additional_models.py
          fi
      - name: Extend eligible medium-range paths
        if: github.event_name != 'push' && inputs.test_mode != true
        continue-on-error: true
        run: python src/extend_model_horizon.py
      - name: Audit every model source, lead, timestamp and required field
        if: always()
        run: |
          python src/audit_integrity.py             --kind models             --input work/model_snapshot.json             --json-out work/model_integrity.json             --md-out work/model_integrity.md
      - name: Publish detailed integrity report in Actions summary
        if: always()
        run: cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer payload and integrity history to private repository
        if: always() && github.event_name != 'push' && inputs.test_mode != true && env.PRIVATE_REPO_TOKEN != ''
        shell: bash
        run: |
          args=(--kind models --integrity-json work/model_integrity.json --integrity-md work/model_integrity.md)
          if [ -f work/model_snapshot.json ]; then
            args+=(--file work/model_snapshot.json)
          fi
          python src/push_private.py "${args[@]}"
      - name: Fail workflow when granular integrity audit found errors
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/model_integrity.json'))
          print('integrity_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
          if d['error_count']:
              raise SystemExit(1)
          PY
