# validation_generation: eps-readback-skm-audit-final-grib-header-20260920-workflow-provenance-proof-20260924
name: Collect model source data

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Reduced lead set and no medium-range extension'
        type: boolean
        default: false
      full_validation:
        description: 'Hard-validate the complete native horizon during a deliberate manual live proof'
        type: boolean
        default: false
      watchdog:
        description: 'Routine external watchdog trigger; respects freshness gate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-model-collector
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      FULL_VALIDATION: ${{ inputs.test_mode != true && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.watchdog == true || inputs.full_validation == true))) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check whether routine model collection is due
        id: due
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watchdog == true)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: python3 src/check_collection_due.py --kind models --max-age-minutes 150

      - name: Report skipped routine model trigger
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watchdog == true)) && steps.due.outputs.due != 'true'
        run: |
          {
            echo "## Model collector schedule check"
            echo
            echo "- Provider fetch skipped: latest successful private transfer is still within the target interval."
            echo "- Previous success: ${{ steps.due.outputs.last_success_generated_at_utc }}"
            echo "- Age: ${{ steps.due.outputs.age_minutes }} min"
            echo "- Threshold: ${{ steps.due.outputs.threshold_minutes }} min"
            echo "- Reason: ${{ steps.due.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install ecCodes
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || steps.due.outputs.due == 'true'
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt'

      - name: Plan provider-specific archived-cycle delta
        id: cycle_gate
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watchdog == true)) && steps.due.outputs.due == 'true'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: python src/provider_cycle_gate.py

      - name: Report provider-cycle no-op
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watchdog == true)) && steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work != 'true'
        run: |
          {
            echo "## Provider cycle gate"
            echo
            echo "- No newly selectable provider cycle requires acquisition."
            echo "- Full provider downloads: 0."
            echo "- Private transfer/promotion: suppressed."
            echo "- Delta prediction: ${{ steps.cycle_gate.outputs.delta_prediction }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch ICON-D2 base horizon
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.icon_d2 != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          set +e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-D2 --stage base "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model ICON-D2 --stage base --exit-code "$rc" --reason "hard_timeout_5m"
          fi
          exit "$rc"

      - name: Fetch GFS base horizon
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.gfs != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          set +e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model GFS --stage base "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model GFS --stage base --exit-code "$rc" --reason "hard_timeout_5m"
          fi
          exit "$rc"

      - name: Fetch GEFS-control base horizon
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.gefs_control != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          set +e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model GEFS-control --stage base "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model GEFS-control --stage base --exit-code "$rc" --reason "hard_timeout_5m"
          fi
          exit "$rc"

      - name: Fetch ICON-EU base horizon
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.icon_eu != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          set +e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-EU --stage base "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model ICON-EU --stage base --exit-code "$rc" --reason "hard_timeout_5m"
          fi
          exit "$rc"

      - name: Fetch ICON-D2-EPS base horizon
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.icon_d2_eps != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          set +e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-D2-EPS --stage base "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model ICON-D2-EPS --stage base --exit-code "$rc" --reason "hard_timeout_5m"
          fi
          exit "$rc"

      - name: Fetch ECMWF-IFS base horizon with mirror fallback
        if: (github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true') && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.ecmwf_ifs != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then args+=(--test); fi
          last=1
          for source in azure google ecmwf; do
            echo "ECMWF base attempt via $source"
            set +e
            ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 6m               python src/provider_fetch.py --model ECMWF-IFS --stage base "${args[@]}"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              python src/record_provider_failure.py --model ECMWF-IFS --stage base --exit-code "$rc" --mirror "$source" --reason "hard_timeout_6m"
            fi
            last=$rc
          done
          exit "$last"

      - name: Extend GFS to cycle horizon
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.gfs != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model GFS --stage extension
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model GFS --stage extension --exit-code "$rc" --reason "hard_timeout_7m"
          fi
          exit "$rc"

      - name: Extend GEFS-control to cycle horizon
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.gefs_control != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model GEFS-control --stage extension
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model GEFS-control --stage extension --exit-code "$rc" --reason "hard_timeout_7m"
          fi
          exit "$rc"

      - name: Extend ICON-EU to cycle horizon
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.icon_eu != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model ICON-EU --stage extension
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python src/record_provider_failure.py --model ICON-EU --stage extension --exit-code "$rc" --reason "hard_timeout_7m"
          fi
          exit "$rc"

      - name: Extend ECMWF-IFS to cycle horizon with mirror fallback
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.ecmwf_ifs != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          last=1
          for source in azure google ecmwf; do
            echo "ECMWF extension attempt via $source"
            set +e
            ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 6m               python src/provider_fetch.py --model ECMWF-IFS --stage extension
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              python src/record_provider_failure.py --model ECMWF-IFS --stage extension --exit-code "$rc" --mirror "$source" --reason "hard_timeout_6m"
            fi
            last=$rc
          done
          exit "$last"

      - name: Attach ICON Tier-A weather context
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && (github.event_name == 'workflow_dispatch' && inputs.watchdog != true || steps.cycle_gate.outputs.icon_d2 != 'carry_forward' || steps.cycle_gate.outputs.icon_eu != 'carry_forward')
        continue-on-error: true
        shell: bash
        run: |
          models=()
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.watchdog != true }}" = "true" ] || [ "${{ steps.cycle_gate.outputs.icon_d2 }}" != "carry_forward" ]; then models+=(ICON-D2); fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.watchdog != true }}" = "true" ] || [ "${{ steps.cycle_gate.outputs.icon_eu }}" != "carry_forward" ]; then models+=(ICON-EU); fi
          set +e
          timeout --signal=TERM --kill-after=15s 10m python src/collect_icon_tier_a.py --workers 4 --models "${models[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "ICON Tier-A optional context timed out; wind-critical collection remains auditable."
          fi
          exit "$rc"

      - name: Archive remaining native model horizons without changing analysis inputs
        if: ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=15s 12m python src/collect_full_horizon.py

      - name: Finalize row and field availability contract
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true'))
        run: python src/availability_contract.py --input work/model_snapshot.json

      - name: Audit every model source, lead, timestamp and required field
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true'))
        run: |
          python src/audit_integrity.py             --kind models             --input work/model_snapshot.json             --json-out work/model_integrity.json             --md-out work/model_integrity.md

      - name: Publish detailed integrity report in Actions summary
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true'))
        run: cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer payload and integrity history to private repository
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true')) && inputs.test_mode != true
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'PRIVATE_REPO_TOKEN is not configured; private transfer skipped.'
            exit 0
          fi
          args=(--kind models --integrity-json work/model_integrity.json --integrity-md work/model_integrity.md)
          if [ -f work/model_snapshot.json ]; then args+=(--file work/model_snapshot.json); fi
          python src/push_private.py "${args[@]}"

      - name: Fail workflow when granular integrity audit found errors
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (steps.due.outputs.due == 'true' && steps.cycle_gate.outputs.any_work == 'true'))
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/model_integrity.json'))
          print('integrity_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
          if d['error_count']:
              raise SystemExit(1)
          PY

