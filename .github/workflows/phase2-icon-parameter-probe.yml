name: Phase 2 ICON parameter live probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/icon_parameter_probe.py'
      - 'tests/test_icon_parameter_probe.py'
      - '.github/workflows/phase2-icon-parameter-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Run bounded +12 h ICON parameter probe
        run: python src/icon_parameter_probe.py --lead 12 --output work/icon_parameter_probe.json
      - name: Show compact probe result
        if: always()
        run: |
          test ! -f work/icon_parameter_probe.json || python -c 'import json; d=json.load(open("work/icon_parameter_probe.json")); print(json.dumps({"total_response_bytes":d["total_response_bytes"],"models":[{"model":m["model"],"cycle":m["cycle"],"received_count":m["received_count"],"missing_parameters":m["missing_parameters"]} for m in d["models"]]},indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-icon-parameter-probe
          path: work/icon_parameter_probe.json
          if-no-files-found: ignore
