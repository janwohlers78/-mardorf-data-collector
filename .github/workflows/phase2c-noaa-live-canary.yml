name: Phase 2c NOAA full activation live canary

on:
  push:
    branches:
      - phase2c-noaa-full-activation
    paths:
      - .github/workflows/phase2c-noaa-live-canary.yml

permissions:
  contents: read

concurrency:
  group: phase2c-noaa-live-canary
  cancel-in-progress: true

jobs:
  canary:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      FULL_VALIDATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt

      - name: Fetch base providers
        shell: bash
        run: |
          set -e
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-D2 --stage base
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model GFS --stage base
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model GEFS-control --stage base
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-EU --stage base
          timeout --signal=TERM --kill-after=15s 5m python src/provider_fetch.py --model ICON-D2-EPS --stage base

      - name: Fetch ECMWF base with mirror fallback
        shell: bash
        run: |
          set -e
          ok=0
          for source in azure google ecmwf; do
            if ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 6m python src/provider_fetch.py --model ECMWF-IFS --stage base; then ok=1; break; fi
          done
          test "$ok" -eq 1

      - name: Extend providers through compatibility horizon
        shell: bash
        run: |
          set -e
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model GFS --stage extension
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model GEFS-control --stage extension
          timeout --signal=TERM --kill-after=15s 7m python src/provider_fetch.py --model ICON-EU --stage extension
          ok=0
          for source in azure google ecmwf; do
            if ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 6m python src/provider_fetch.py --model ECMWF-IFS --stage extension; then ok=1; break; fi
          done
          test "$ok" -eq 1

      - name: Attach ICON Tier-A context
        run: timeout --signal=TERM --kill-after=15s 10m python src/collect_icon_tier_a.py --workers 4

      - name: Archive full native horizons with complete NOAA context
        run: timeout --signal=TERM --kill-after=15s 15m python src/collect_full_horizon.py

      - name: Audit complete canary
        run: |
          python src/audit_integrity.py --kind models --input work/model_snapshot.json --json-out work/model_integrity.json --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          d=json.load(open('work/model_integrity.json'))
          print('integrity_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
          if d['error_count']:
              raise SystemExit(1)
          PY

      - name: Transfer canary to private Archive-v3 path
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          test -n "$PRIVATE_REPO_TOKEN"
          python src/push_private.py --kind models --file work/model_snapshot.json --integrity-json work/model_integrity.json --integrity-md work/model_integrity.md
