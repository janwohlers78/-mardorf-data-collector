name: Phase 2c NOAA final live canary

on:
  push:
    branches:
      - phase2c-noaa-final-canary
    paths:
      - .github/workflows/phase2c-noaa-final-live-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      FULL_VALIDATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt'
      - name: Collect base models
        run: |
          python src/provider_fetch.py --model ICON-D2 --stage base
          python src/provider_fetch.py --model GFS --stage base
          python src/provider_fetch.py --model GEFS-control --stage base
          python src/provider_fetch.py --model ICON-EU --stage base
          python src/provider_fetch.py --model ICON-D2-EPS --stage base
      - name: Collect ECMWF base
        run: |
          ECMWF_OPEN_DATA_SOURCE=azure python src/provider_fetch.py --model ECMWF-IFS --stage base || ECMWF_OPEN_DATA_SOURCE=google python src/provider_fetch.py --model ECMWF-IFS --stage base || ECMWF_OPEN_DATA_SOURCE=ecmwf python src/provider_fetch.py --model ECMWF-IFS --stage base
      - name: Extend compatibility horizon
        run: |
          python src/provider_fetch.py --model GFS --stage extension
          python src/provider_fetch.py --model GEFS-control --stage extension
          python src/provider_fetch.py --model ICON-EU --stage extension
          ECMWF_OPEN_DATA_SOURCE=azure python src/provider_fetch.py --model ECMWF-IFS --stage extension || ECMWF_OPEN_DATA_SOURCE=google python src/provider_fetch.py --model ECMWF-IFS --stage extension || ECMWF_OPEN_DATA_SOURCE=ecmwf python src/provider_fetch.py --model ECMWF-IFS --stage extension
      - name: Attach ICON Tier-A
        run: python src/collect_icon_tier_a.py --workers 4
      - name: Archive native horizons
        run: python src/collect_full_horizon.py
      - name: Audit
        run: |
          python src/audit_integrity.py --kind models --input work/model_snapshot.json --json-out work/model_integrity.json --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify NOAA boundary and metadata
        run: |
          python - <<'PY'
          import json
          p=json.load(open("work/model_snapshot.json"))
          def all_rows(model):
              rows=list(p["models"].get(model,[]))
              rows += list(p.get("full_horizon_archive",{}).get("sources",{}).get(model,{}).get("records",[]))
              return rows
          def row_at(model,lead):
              xs=[r for r in all_rows(model) if int(r.get("forecast_lead_hours",-1))==lead]
              if len(xs)!=1:
                  raise SystemExit(f"{model} lead {lead}: expected exactly one row, got {len(xs)}")
              return xs[0]
          def variants(row,key):
              return [x for x in (row.get("values",{}).get(key) or []) if isinstance(x,dict)]
          report={"gfs":{},"gefs":{}}
          g384=row_at("GFS",384)
          report["gfs"]["lead384_product"]=g384.get("provider_product")
          report["gfs"]["lead384_keys"]=sorted(g384.get("values",{}))
          report["gfs"]["tcc_variants"]=[{"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in variants(g384,"tcc")]
          report["gfs"]["cape_variants"]=[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"stepType":x.get("stepType"),"paramId":x.get("paramId")} for x in variants(g384,"cape")]
          for lead in (240,246,384):
              r=row_at("GEFS-control",lead)
              item={
                  "provider_product":r.get("provider_product"),
                  "keys":sorted(r.get("values",{})),
                  "weather_context_availability":r.get("weather_context_availability"),
                  "dpt_variants":[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in variants(r,"2d")],
                  "cape_variants":[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in variants(r,"cape")],
              }
              report["gefs"][str(lead)]=item
          if "gfs_0p25" not in str(g384.get("provider_product")):
              raise SystemExit("GFS 384 provider_product missing gfs_0p25")
          if len(report["gfs"]["tcc_variants"]) < 2:
              raise SystemExit("GFS 384 did not preserve both TCDC native variants")
          if len(report["gfs"]["cape_variants"]) < 2:
              raise SystemExit("GFS 384 CAPE native variants collapsed")
          if "gefs_0p25s" not in str(report["gefs"]["240"]["provider_product"]):
              raise SystemExit("GEFS 240 product boundary incorrect")
          if "gefs_0p50a" not in str(report["gefs"]["246"]["provider_product"]):
              raise SystemExit("GEFS 246 missing 0p50a")
          # pgrb2b is optional for gust; when present it must carry DPT distinctly.
          p246=str(report["gefs"]["246"]["provider_product"])
          d246=report["gefs"]["246"]["dpt_variants"]
          if "gefs_0p50b" in p246 and not d246:
              raise SystemExit("GEFS 246 0p50b was received but DPT was not preserved")
          # The terminal far-range row must follow the same contract.
          p384=str(report["gefs"]["384"]["provider_product"])
          d384=report["gefs"]["384"]["dpt_variants"]
          if "gefs_0p50b" in p384 and not d384:
              raise SystemExit("GEFS 384 0p50b was received but DPT was not preserved")
          json.dump(report,open("work/noaa_final_boundary_report.json","w"),indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-noaa-final-live-canary
          path: |
            work/model_snapshot.json
            work/model_integrity.json
            work/model_integrity.md
            work/noaa_final_boundary_report.json
          if-no-files-found: error
          retention-days: 7
