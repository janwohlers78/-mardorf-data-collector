name: Phase 2c NOAA final live canary v3

on:
  push:
    branches:
      - phase2c-noaa-final-canary-v3
    paths:
      - .github/workflows/phase2c-noaa-final-live-canary-v3.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      FULL_VALIDATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt'
      - name: Collect base models
        run: |
          python src/provider_fetch.py --model ICON-D2 --stage base
          python src/provider_fetch.py --model GFS --stage base
          python src/provider_fetch.py --model GEFS-control --stage base
          python src/provider_fetch.py --model ICON-EU --stage base
          python src/provider_fetch.py --model ICON-D2-EPS --stage base
      - name: Collect ECMWF base
        run: |
          ECMWF_OPEN_DATA_SOURCE=azure python src/provider_fetch.py --model ECMWF-IFS --stage base || ECMWF_OPEN_DATA_SOURCE=google python src/provider_fetch.py --model ECMWF-IFS --stage base || ECMWF_OPEN_DATA_SOURCE=ecmwf python src/provider_fetch.py --model ECMWF-IFS --stage base
      - name: Extend compatibility horizon
        run: |
          python src/provider_fetch.py --model GFS --stage extension
          python src/provider_fetch.py --model GEFS-control --stage extension
          python src/provider_fetch.py --model ICON-EU --stage extension
          ECMWF_OPEN_DATA_SOURCE=azure python src/provider_fetch.py --model ECMWF-IFS --stage extension || ECMWF_OPEN_DATA_SOURCE=google python src/provider_fetch.py --model ECMWF-IFS --stage extension || ECMWF_OPEN_DATA_SOURCE=ecmwf python src/provider_fetch.py --model ECMWF-IFS --stage extension
      - name: Attach ICON Tier-A
        run: python src/collect_icon_tier_a.py --workers 4
      - name: Archive native horizons
        run: python src/collect_full_horizon.py
      - name: Audit
        run: |
          python src/audit_integrity.py --kind models --input work/model_snapshot.json --json-out work/model_integrity.json --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify final NOAA contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("work/model_snapshot.json"))
          def all_rows(model):
              return list(p["models"].get(model,[]))+list(p.get("full_horizon_archive",{}).get("sources",{}).get(model,{}).get("records",[]))
          def row_at(model,lead):
              rows=[r for r in all_rows(model) if int(r.get("forecast_lead_hours",-1))==lead]
              if len(rows)!=1:
                  raise SystemExit(f"{model} lead {lead}: expected one row, got {len(rows)}")
              return rows[0]
          def vals(row,key):
              return [x for x in (row.get("values",{}).get(key) or []) if isinstance(x,dict)]
          report={}
          g384=row_at("GFS",384)
          report["gfs384"]={
              "provider_product":g384.get("provider_product"),
              "tcc":[{"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in vals(g384,"tcc")],
              "cape":[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"paramId":x.get("paramId")} for x in vals(g384,"cape")],
              "keys":sorted(g384.get("values",{})),
          }
          if g384.get("provider_product")!="gfs_0p25":
              raise SystemExit("GFS terminal product identity wrong")
          if {x.get("stepType") for x in vals(g384,"tcc")}!={"instant","avg"}:
              raise SystemExit("GFS terminal TCDC instant/avg variants not preserved")
          if len(vals(g384,"cape"))<4:
              raise SystemExit("GFS terminal CAPE variants incomplete")
          report["gefs"]={}
          for lead in (240,246,384):
              r=row_at("GEFS-control",lead)
              report["gefs"][str(lead)]={
                  "provider_product":r.get("provider_product"),
                  "dpt":[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in vals(r,"2d")],
                  "cape":[{"typeOfLevel":x.get("typeOfLevel"),"level":x.get("level"),"stepType":x.get("stepType"),"stepRange":x.get("stepRange"),"paramId":x.get("paramId")} for x in vals(r,"cape")],
                  "optional_product_errors":r.get("optional_product_errors",[]),
                  "keys":sorted(r.get("values",{})),
              }
          if report["gefs"]["240"]["provider_product"]!="gefs_0p25s":
              raise SystemExit("GEFS 240 product boundary wrong")
          for lead in ("246","384"):
              product=str(report["gefs"][lead]["provider_product"])
              if "gefs_0p50a" not in product or "gefs_0p50b" not in product:
                  raise SystemExit(f"GEFS {lead} missing a+b product identity: {product}")
              if not report["gefs"][lead]["dpt"]:
                  raise SystemExit(f"GEFS {lead} DPT missing after pgrb2b weather separation")
              if report["gefs"][lead]["optional_product_errors"]:
                  raise SystemExit(f"GEFS {lead} unexpected optional product error")
          json.dump(report,open("work/noaa_final_contract_report.json","w"),indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-noaa-final-live-canary-v3
          path: |
            work/model_snapshot.json
            work/model_integrity.json
            work/model_integrity.md
            work/noaa_final_contract_report.json
          if-no-files-found: error
          retention-days: 7
