name: Reject external contributions

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  close-external-pull-request:
    if: github.repository == 'janwohlers78/mardorf-data-collector' && github.event_name == 'pull_request_target' && github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close external pull request without checking out code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/pulls/$NUMBER" -f state=closed >/dev/null

  close-external-issue:
    if: github.repository == 'janwohlers78/mardorf-data-collector' && github.event_name == 'issues' && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close external issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/issues/$NUMBER" -f state=closed -f state_reason=not_planned >/dev/null

# SECURITY:
# - No checkout is performed on pull_request_target.
# - No repository or environment secrets are referenced.
# - The workflow only closes external contribution objects in the upstream repo.
