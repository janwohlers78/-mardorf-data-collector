name: Validate collector code

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'tests/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile collector
        run: python -m compileall -q src tests
      - name: Run integrity regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Parse integrity policy
        run: python -m json.tool config/integrity_policy.json >/dev/null
      - name: Verify no generated data is tracked
        run: |
          test ! -e work
          if git ls-files | grep -E '^(data|work)/'; then
            echo 'Generated data/work files must never be tracked in the public collector.'
            exit 1
          fi
