name: Validate collector code

on:
  push:
    branches: [main, cutover-v15-hourly-source-20260920]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'tests/**'
      - 'README.md'
      - 'requirements-runtime.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject obvious committed credential material
        run: |
          if git grep -nE '(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- .; then
            echo 'Potential credential material detected in tracked public files.'
            exit 1
          fi
      - name: Install pinned test/runtime dependencies
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt'
      - name: Compile collector
        run: python -m compileall -q src tests
      - name: Run integrity regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Parse integrity policy
        run: python -m json.tool config/integrity_policy.json >/dev/null
      - name: Verify no generated data is tracked
        run: |
          test ! -e work
          if git ls-files | grep -E '^(data|work)/'; then
            echo 'Generated data/work files must never be tracked in the public collector.'
            exit 1
          fi
