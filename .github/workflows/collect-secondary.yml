name: Collect Wunstorf and ETNW observations

on:
  push:
    branches: [main, public-secondary-observations-20260920]
    paths:
      - 'src/fetch_wunstorf.py'
      - 'src/fetch_etnw_metar.py'
      - 'src/audit_secondary_integrity.py'
      - 'src/push_private.py'
      - 'config/integrity_policy.json'
      - '.github/workflows/collect-secondary.yml'
  schedule:
    - cron: '47 0,4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-secondary-observations
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt

      - name: Fetch DWD Wunstorf historical reference
        continue-on-error: true
        run: python src/fetch_wunstorf.py

      - name: Audit Wunstorf identity timestamps and wind rows
        if: always()
        run: |
          python src/audit_secondary_integrity.py \
            --kind wunstorf \
            --input work/wunstorf_bundle.json \
            --json-out work/wunstorf_integrity.json \
            --md-out work/wunstorf_integrity.md

      - name: Fetch ETNW METAR redundancy
        continue-on-error: true
        run: python src/fetch_etnw_metar.py

      - name: Audit ETNW identity timestamps and freshness
        if: always()
        run: |
          python src/audit_secondary_integrity.py \
            --kind etnw \
            --input work/etnw_bundle.json \
            --json-out work/etnw_integrity.json \
            --md-out work/etnw_integrity.md

      - name: Transfer Wunstorf payload and integrity
        if: always() && github.ref == 'refs/heads/main'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          args=(--kind wunstorf --integrity-json work/wunstorf_integrity.json --integrity-md work/wunstorf_integrity.md)
          if [ -f work/wunstorf_bundle.json ]; then args+=(--file work/wunstorf_bundle.json); fi
          python src/push_private.py "${args[@]}"

      - name: Transfer ETNW payload and integrity
        if: always() && github.ref == 'refs/heads/main'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          args=(--kind etnw --integrity-json work/etnw_integrity.json --integrity-md work/etnw_integrity.md)
          if [ -f work/etnw_bundle.json ]; then args+=(--file work/etnw_bundle.json); fi
          python src/push_private.py "${args[@]}"

      - name: Fail on secondary-source integrity errors
        if: always()
        run: |
          python - <<'PY'
          import json
          failed=[]
          for kind in ('wunstorf','etnw'):
              d=json.load(open(f'work/{kind}_integrity.json'))
              print(kind,d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
              if d['error_count']:
                  failed.append(kind)
          if failed:
              raise SystemExit('integrity errors: '+','.join(failed))
          PY
