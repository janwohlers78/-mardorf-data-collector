# validation_generation: skm-readback-audit-svg-cutover-20260920
name: Collect SVG WeatherLink data

on:
  push:
    branches: [main]
    paths:
      - 'src/fetch_svg_weatherlink.py'
      - 'src/fetch_skm_optional.py'
      - 'src/audit_integrity.py'
      - 'src/push_private.py'
      - 'src/check_collection_due.py'
      - 'config/integrity_policy.json'
      - 'requirements-runtime.txt'
      - 'src/fetch_wunstorf.py'
      - 'src/fetch_etnw_metar.py'
      - 'src/audit_secondary_integrity.py'
      - '.github/workflows/collect-svg.yml'
  schedule:
    - cron: '13,33,53 * * * *'
    - cron: '47 0,4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-svg-collector
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ github.repository == 'janwohlers78/mardorf-data-collector' && (github.event_name != 'schedule' || github.event.schedule == '13,33,53 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check whether scheduled SVG collection is due
        id: due
        if: github.event_name == 'schedule'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: python3 src/check_collection_due.py --kind svg --max-age-minutes 50

      - name: Report skipped schedule check
        if: github.event_name == 'schedule' && steps.due.outputs.due != 'true'
        run: |
          {
            echo "## SVG collector schedule check"
            echo
            echo "- Provider fetch skipped: latest successful private transfer is still within the freshness target."
            echo "- Previous success: ${{ steps.due.outputs.last_success_generated_at_utc }}"
            echo "- Age: ${{ steps.due.outputs.age_minutes }} min"
            echo "- Threshold: ${{ steps.due.outputs.threshold_minutes }} min"
            echo "- Reason: ${{ steps.due.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'

      - name: Install dependency
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt'

      - name: Fetch SVG endpoints and record exact request diagnostics
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
        run: python src/fetch_svg_weatherlink.py

      - name: Audit endpoint results, observation age and five-minute archive continuity
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true')
        run: |
          python src/audit_integrity.py \
            --kind svg \
            --input work/svg_bundle.json \
            --json-out work/svg_integrity.json \
            --md-out work/svg_integrity.md

      - name: Fetch optional SKM MeteoMap station 898
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        continue-on-error: true
        run: python src/fetch_skm_optional.py

      - name: Audit optional SKM without gating SVG
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true')
        continue-on-error: true
        run: |
          python src/audit_integrity.py \
            --kind skm \
            --input work/skm_bundle.json \
            --json-out work/skm_integrity.json \
            --md-out work/skm_integrity.md

      - name: Publish detailed integrity reports in Actions summary
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true')
        run: |
          cat work/svg_integrity.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "---"
            echo
            cat work/skm_integrity.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer payload and integrity history to private repository
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[full-svg-validation]'))
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'PRIVATE_REPO_TOKEN is not configured; private transfer skipped.'
            exit 0
          fi
          args=(--kind svg --integrity-json work/svg_integrity.json --integrity-md work/svg_integrity.md)
          if [ -f work/svg_bundle.json ]; then
            args+=(--file work/svg_bundle.json)
          fi
          python src/push_private.py "${args[@]}"

      - name: Transfer optional SKM payload and health to private repository
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[full-svg-validation]'))
        continue-on-error: true
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'PRIVATE_REPO_TOKEN is not configured; optional SKM transfer skipped.'
            exit 0
          fi
          args=(--kind skm --integrity-json work/skm_integrity.json --integrity-md work/skm_integrity.md)
          if [ -f work/skm_bundle.json ]; then
            args+=(--file work/skm_bundle.json)
          fi
          python src/push_private.py "${args[@]}"

      - name: Report optional SKM status without gating primary evaluation
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true')
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('work/skm_integrity.json')
          if not p.exists():
              print('optional_skm_status=NO_REPORT; primary SVG/model evaluation remains unaffected')
          else:
              d=json.load(open(p))
              print('optional_skm_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'],
                    'non_blocking=',d.get('non_blocking'))
          PY

      - name: Fail workflow when granular integrity audit found errors
        if: always() && (github.event_name != 'schedule' || steps.due.outputs.due == 'true')
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/svg_integrity.json'))
          print('integrity_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
          if d['error_count']:
              raise SystemExit(1)
          PY

  collect-secondary:
    if: ${{ github.repository == 'janwohlers78/mardorf-data-collector' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '47 0,4,10,16,22 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-secondary-validation]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt

      - name: Fetch DWD Wunstorf historical reference
        continue-on-error: true
        run: python src/fetch_wunstorf.py

      - name: Audit Wunstorf identity timestamps and wind rows
        if: always()
        run: |
          python src/audit_secondary_integrity.py \
            --kind wunstorf \
            --input work/wunstorf_bundle.json \
            --json-out work/wunstorf_integrity.json \
            --md-out work/wunstorf_integrity.md

      - name: Fetch ETNW METAR redundancy
        continue-on-error: true
        run: python src/fetch_etnw_metar.py

      - name: Audit ETNW identity timestamps and freshness
        if: always()
        run: |
          python src/audit_secondary_integrity.py \
            --kind etnw \
            --input work/etnw_bundle.json \
            --json-out work/etnw_integrity.json \
            --md-out work/etnw_integrity.md

      - name: Publish secondary-source integrity reports in Actions summary
        if: always()
        run: |
          cat work/wunstorf_integrity.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "---"
            echo
            cat work/etnw_integrity.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer Wunstorf payload and integrity to private repository
        if: always()
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'PRIVATE_REPO_TOKEN is not configured; Wunstorf transfer skipped.'
            exit 0
          fi
          args=(--kind wunstorf --integrity-json work/wunstorf_integrity.json --integrity-md work/wunstorf_integrity.md)
          if [ -f work/wunstorf_bundle.json ]; then
            args+=(--file work/wunstorf_bundle.json)
          fi
          python src/push_private.py "${args[@]}"

      - name: Transfer ETNW payload and integrity to private repository
        if: always()
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'PRIVATE_REPO_TOKEN is not configured; ETNW transfer skipped.'
            exit 0
          fi
          args=(--kind etnw --integrity-json work/etnw_integrity.json --integrity-md work/etnw_integrity.md)
          if [ -f work/etnw_bundle.json ]; then
            args+=(--file work/etnw_bundle.json)
          fi
          python src/push_private.py "${args[@]}"

      - name: Fail workflow on Wunstorf or ETNW integrity errors
        if: always()
        run: |
          python - <<'PY'
          import json
          failed=[]
          for kind in ('wunstorf','etnw'):
              d=json.load(open(f'work/{kind}_integrity.json'))
              print(kind,'status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
              if d['error_count']:
                  failed.append(kind)
          if failed:
              raise SystemExit('integrity errors: '+','.join(failed))
          PY

